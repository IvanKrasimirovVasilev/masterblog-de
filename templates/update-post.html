{% extends "layout.html" %}

{% block title %}Update Post{% endblock %}

{% block content %}

    <section class="post-form post-form--update">
        <h1 class="post-form__title">Update Blog Post</h1>

        <form class="post-form__form" method="POST">

            <div class="post-form__field mb-3">
                <label class="post-form__label form-label"
                       for="author">
                    Author
                </label>

                <input class="post-form__input form-control"
                       type="text"
                       id="author"
                       name="author"
                       value="{{ post.author }}"
                       required>
            </div>

            <div class="post-form__field mb-3">
                <label class="post-form__label form-label"
                       for="title">
                    Title
                </label>

                <input class="post-form__input form-control"
                       type="text"
                       id="title"
                       name="title"
                       value="{{ post.title }}"
                       required>
            </div>

            <div class="post-form__field mb-3">
                <label class="post-form__label form-label"
                       for="content">
                    Content
                </label>

                <textarea class="post-form__textarea form-control"
                          id="content"
                          name="content"
                          rows="6"
                          required>{{ post.content }}</textarea>
            </div>

            <button class="post-form__submit btn btn-primary"
                    type="submit">
                Update Post
            </button>

        </form>
    </section>

{% endblock %}
