<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Flask Blog{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="blog">

    <header class="blog__header">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand blog__logo"
                   href="{{ url_for('index') }}">
                    Masterblog
                </a>

                <div class="navbar-nav">
                    <a class="nav-link blog__nav-link"
                       href="{{ url_for('index') }}">
                        Home
                    </a>

                    <a class="nav-link blog__nav-link"
                       href="{{ url_for('add_post') }}">
                        Add Post
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="blog__main container py-4">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
