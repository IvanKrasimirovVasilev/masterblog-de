{% extends "layout.html" %}

{% block title %}My Flask Blog{% endblock %}

{% block content %}

    <h1>Welcome to My Flask Blog!</h1>

    {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p><em>Written by {{ post.author }}</em></p>
            <p>{{ post.content }}</p>

            <div class="post__actions">
                <a class="post__update btn btn-primary"
                   href="{{ url_for('update_post', post_id=post.id) }}">
                    Edit post
                </a>

                <a class="post__delete btn btn-danger"
                   href="{{ url_for('delete_post', post_id=post.id) }}">
                    Delete post
                </a>
            </div>

        </div>

    {% endfor %}

{% endblock %}
